name: Publish Beszel to Northflank

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built image to Northflank
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: beszel-northflank-production
  cancel-in-progress: false

env:
  NORTHFLANK_REGISTRY: registry.northflank.com
  NORTHFLANK_PROJECT: default
  NORTHFLANK_IMAGE: beszel-hub-actions

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/beszel-northflank-transfer-check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 63cac3521a7a06596f2fd57a0694376ae973e354
      RESERVED_IMAGE_ID: 6b092f5981a1d24221667f4b
      RESERVED_IMAGE_TAG: sha-63cac3521a7a06596f2fd57a0694376ae973e354-45957601476-1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build Linux amd64 image
        run: |
          cp supplemental/northflank/upload-oci.py "$RUNNER_TEMP/upload-oci.py"
          git checkout --detach "$SOURCE_SHA"
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file Dockerfile.northflank \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --output "type=oci,dest=$RUNNER_TEMP/beszel.oci.tar" .

      - name: Publish and verify project image
        if: inputs.publish
        env:
          NORTHFLANK_IMAGE_PUSH_TOKEN: ${{ secrets.NORTHFLANK_IMAGE_PUSH_TOKEN }}
        run: |
          if [[ -z "$NORTHFLANK_IMAGE_PUSH_TOKEN" ]]; then
            echo '::error::Set NORTHFLANK_IMAGE_PUSH_TOKEN to enable publishing.'
            exit 1
          fi

          northflank_api() {
            printf 'Authorization: Bearer %s\n' "$NORTHFLANK_IMAGE_PUSH_TOKEN" | \
              curl --fail --silent --show-error --max-time 15 --header @- "$@"
          }

          # Reserve an immutable tag and use the short-lived, repository-scoped upload token.
          tag="$RESERVED_IMAGE_TAG"
          api="https://api.northflank.com/v1/projects/$NORTHFLANK_PROJECT/images"
          payload=$(jq -nc --arg name "$NORTHFLANK_IMAGE" --arg tag "$tag" \
            --arg imageId "$RESERVED_IMAGE_ID" '{name: $name, tag: $tag, imageId: $imageId}')
          response_file="$RUNNER_TEMP/transfer-reservation.json"
          trap 'rm -f "$response_file"' EXIT
          code=$(printf 'Authorization: Bearer %s\n' "$NORTHFLANK_IMAGE_PUSH_TOKEN" | \
            curl --silent --show-error --max-time 15 --header @- --header 'Content-Type: application/json' \
              --request POST --data "$payload" --output "$response_file" --write-out '%{http_code}' "$api/upload-credentials")
          if [[ "$code" != 200 ]]; then
            printf '::error::Refreshing the existing reservation returned HTTP %s\n' "$code"
            exit 1
          fi
          reservation=$(cat "$response_file")
          rm -f "$response_file"

          registry_url=$(jq -r '.data.registryUrl // ""' <<< "$reservation")
          repository=$(jq -r '.data.repository // ""' <<< "$reservation")
          image_id=$(jq -r '.data.imageId // ""' <<< "$reservation")
          upload_token=$(jq -r '.data.token // ""' <<< "$reservation")
          unset reservation
          if [[ "${registry_url%/}" != "https://$NORTHFLANK_REGISTRY" && \
                "${registry_url%/}" != "$NORTHFLANK_REGISTRY" ]]; then
            echo '::error::Northflank returned an unexpected upload registry.'
            exit 1
          fi
          if [[ ! "$repository" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ || \
                ! "$image_id" =~ ^[a-f0-9]{24}$ || \
                ! "$upload_token" =~ ^[A-Za-z0-9._~+/=-]+$ ]]; then
            echo '::error::Northflank returned invalid upload credentials.'
            exit 1
          fi

          printf 'Reserved Northflank image %s:%s (%s)\n' "$NORTHFLANK_IMAGE" "$tag" "$image_id"
          NORTHFLANK_UPLOAD_TOKEN="$upload_token" \
            python3 "$RUNNER_TEMP/upload-oci.py" "$RUNNER_TEMP/beszel.oci.tar" "$repository" "$tag"
          unset upload_token

          # Hold the workflow's concurrency slot until Northflank validates the image.
          for ((attempt = 1; attempt <= 60; attempt++)); do
            response=$(northflank_api --retry 2 "$api/$image_id")
            status=$(jq -r --arg name "$NORTHFLANK_IMAGE" --arg tag "$tag" \
              '.data | select(.name == $name and .tag == $tag) | .status // ""' \
              <<< "$response")

            case "$status" in
              READY)
                printf 'Northflank image ready: `%s:%s` (`%s`)\n' \
                  "$NORTHFLANK_IMAGE" "$tag" "$image_id" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILURE|EXPIRED)
                echo "::error::Northflank reported $status for $NORTHFLANK_IMAGE:$tag."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "::error::Timed out waiting for Northflank to validate $NORTHFLANK_IMAGE:$tag."
          exit 1
